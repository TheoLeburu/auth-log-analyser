name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests samples

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Verify the sample log still regenerates identically
        run: |
          python samples/generate_sample_log.py > /tmp/regenerated.log
          diff -q samples/auth.log /tmp/regenerated.log

      - name: Smoke test the CLI
        run: python -m app.cli samples/auth.log --no-colour
